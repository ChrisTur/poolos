version: 2
updates:
  # npm — all packages in one weekly PR
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: develop
    open-pull-requests-limit: 2
    groups:
      all-dependencies:
        patterns: ["*"]
    ignore:
      # Require manual review for major version bumps
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: develop
    open-pull-requests-limit: 1
    groups:
      all-actions:
        patterns: ["*"]
